 <feColorMatrix in="c" type="matrix" values="0 0 0 0 .03  0 0 0 0 .03  0 0 0 0 .03  -3 0 0 0 1.15" result="cc"/>
 <feMerge><feMergeNode in="f"/><feMergeNode in="ac"/><feMergeNode in="bc"/><feMergeNode in="cc"/></feMerge>
