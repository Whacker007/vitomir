<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 563.2 206.8" width="261" height="96"><defs>
<filter id="bone" x="-2%" y="-5%" width="104%" height="110%" color-interpolation-filters="sRGB">
 <feFlood flood-color="#ddd1b6" result="base"/>
 <feTurbulence type="fractalNoise" baseFrequency=".018 .05" numOctaves="4" seed="7" result="stain"/>
 <feColorMatrix in="stain" type="matrix" values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  1.3 0 0 0 -.55" result="st"/>
 <feTurbulence type="turbulence" baseFrequency=".9" numOctaves="2" seed="3" result="pore"/>
 <feColorMatrix in="pore" type="matrix" values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 -1.1 .42" result="po"/>
 <feTurbulence type="fractalNoise" baseFrequency=".11 .007" numOctaves="2" seed="21" result="crk"/>
 <feColorMatrix in="crk" type="matrix" values="0 0 0 0 .33  0 0 0 0 .26  0 0 0 0 .18  -16 0 0 0 5.4" result="cr"/>
 <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="ab"/>
 <feComponentTransfer in="ab" result="edge"><feFuncA type="table" tableValues=".85 .5 .15 0 0"/></feComponentTransfer>
 <feFlood flood-color="#3a2c1c"/><feComposite in2="edge" operator="in" result="ed"/>
 <feMerge result="m"><feMergeNode in="base"/><feMergeNode in="st"/><feMergeNode in="po"/><feMergeNode in="cr"/><feMergeNode in="ed"/></feMerge>
 <feComposite in="m" in2="SourceAlpha" operator="in"/>
</filter>
<filter id="blood" x="-2%" y="-5%" width="104%" height="110%" color-interpolation-filters="sRGB">
 <feFlood flood-color="#6e141b" result="base"/>
 <feTurbulence type="fractalNoise" baseFrequency=".03 .06" numOctaves="3" seed="9" result="n"/>
 <feColorMatrix in="n" type="matrix" values="0 0 0 0 .2  0 0 0 0 .02  0 0 0 0 .04  1.4 0 0 0 -.55" result="dk"/>
 <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="ab"/>
 <feComponentTransfer in="ab" result="edge"><feFuncA type="table" tableValues=".8 .45 .1 0 0"/></feComponentTransfer>
 <feFlood flood-color="#1e0507"/><feComposite in2="edge" operator="in" result="ed"/>
 <feMerge result="m"><feMergeNode in="base"/><feMergeNode in="dk"/><feMergeNode in="ed"/></feMerge>
 <feComposite in="m" in2="SourceAlpha" operator="in"/>
</filter>
<filter id="ochre" x="-2%" y="-5%" width="104%" height="110%" color-interpolation-filters="sRGB">
 <feFlood flood-color="#8c3121" result="base"/>
 <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="4" seed="5" result="n"/>
 <feColorMatrix in="n" type="matrix" values="0 0 0 0 .32  0 0 0 0 .1  0 0 0 0 .06  1.5 0 0 0 -.6" result="dk"/>
 <feTurbulence type="turbulence" baseFrequency=".8" numOctaves="2" seed="8" result="p"/>
 <feColorMatrix in="p" type="matrix" values="0 0 0 0 .75  0 0 0 0 .45  0 0 0 0 .3  0 0 0 -1 .35" result="lt"/>
 <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="ab"/>
 <feComponentTransfer in="ab" result="edge"><feFuncA type="table" tableValues=".7 .35 .05 0 0"/></feComponentTransfer>
 <feFlood flood-color="#2a0c06"/><feComposite in2="edge" operator="in" result="ed"/>
 <feMerge result="m"><feMergeNode in="base"/><feMergeNode in="dk"/><feMergeNode in="lt"/><feMergeNode in="ed"/></feMerge>
 <feComposite in="m" in2="SourceAlpha" operator="in"/>
</filter>
<filter id="clay" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
 <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="12" result="a"/>
 <feColorMatrix in="a" type="matrix" values="0 0 0 0 .40  0 0 0 0 .30  0 0 0 0 .21  0 0 0 0 1" result="ac"/>
 <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="2" result="b"/>
 <feColorMatrix in="b" type="matrix" values="0 0 0 0 .2  0 0 0 0 .14  0 0 0 0 .09  1.2 0 0 0 -.45" result="bc"/>
 <feFlood flood-color="#80664a" result="f"/>
 <feBlend in="ac" in2="f" mode="multiply" result="m1"/>
 <feMerge><feMergeNode in="f"/><feMergeNode in="ac"/><feMergeNode in="bc"/></feMerge>
</filter>
<filter id="press" x="-5%" y="-10%" width="110%" height="130%" color-interpolation-filters="sRGB">
 <feFlood flood-color="#2b2016"/><feComposite in2="SourceAlpha" operator="in" result="hole"/>
 <feOffset in="SourceAlpha" dx="-3" dy="-4" result="o"/><feGaussianBlur in="o" stdDeviation="2.2" result="ob"/>
 <feComposite in="SourceAlpha" in2="ob" operator="out" result="rim"/>
 <feFlood flood-color="#0e0906" flood-opacity=".9"/><feComposite in2="rim" operator="in" result="inner"/>
 <feOffset in="SourceAlpha" dx="2" dy="2.5" result="lo"/><feComposite in="lo" in2="SourceAlpha" operator="out" result="lip"/>
 <feFlood flood-color="#b39b7c" flood-opacity=".55"/><feComposite in2="lip" operator="in" result="lipc"/>
 <feMerge><feMergeNode in="hole"/><feMergeNode in="SourceGraphic"/><feMergeNode in="inner"/><feMergeNode in="lipc"/></feMerge>
</filter>
<filter id="basalt" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
