<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32"><defs>
<filter id="bone" x="-2%" y="-5%" width="104%" height="110%" color-interpolation-filters="sRGB">
 <feFlood flood-color="#ddd1b6" result="base"/>
 <feTurbulence type="fractalNoise" baseFrequency=".018 .05" numOctaves="4" seed="7" result="stain"/>
 <feColorMatrix in="stain" type="matrix" values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  1.3 0 0 0 -.55" result="st"/>
 <feTurbulence type="turbulence" baseFrequency=".9" numOctaves="2" seed="3" result="pore"/>
 <feColorMatrix in="pore" type="matrix" values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 -1.1 .42" result="po"/>
 <feTurbulence type="fractalNoise" baseFrequency=".11 .007" numOctaves="2" seed="21" result="crk"/>
 <feColorMatrix in="crk" type="matrix" values="0 0 0 0 .33  0 0 0 0 .26  0 0 0 0 .18  -16 0 0 0 5.4" result="cr"/>
 <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="ab"/>
 <feComponentTransfer in="ab" result="edge"><feFuncA type="table" tableValues=".85 .5 .15 0 0"/></feComponentTransfer>
 <feFlood flood-color="#3a2c1c"/><feComposite in2="edge" operator="in" result="ed"/>
 <feMerge result="m"><feMergeNode in="base"/><feMergeNode in="st"/><feMergeNode in="po"/><feMergeNode in="cr"/><feMergeNode in="ed"/></feMerge>
 <feComposite in="m" in2="SourceAlpha" operator="in"/>
</filter>
<filter id="blood" x="-2%" y="-5%" width="104%" height="110%" color-interpolation-filters="sRGB">
