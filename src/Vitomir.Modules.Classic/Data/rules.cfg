; A vampire or a ghoul falling to this share of its pool says vox_lowblood.
LowBloodBarkFraction = 0.2

; Whether humans and monsters have no frenzy (a write of it is made 0).
FrenzyCapActorTypes = true

[Death]
; Death, the corpse's clocks, the dust and the revive.

; A killing blow over this plays the quick death; at or under it, the slow death (or the sun's).
