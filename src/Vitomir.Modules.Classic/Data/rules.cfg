[Items]
; Prices, containers and treasure. The store rates are the .nbs files', the effects' costs misc/effects.ned's.

; Price paid = value × store buy rate × (base + slope × trader Manipulation × percent), each step truncated, at least
; the floor. Worked in single precision from these doubles, as 1.1 does.
; Values: base, slope, percent
BuyPriceFactor = 1.3, -0.6, 0.01

; Price received = value × store sell rate × (base + slope × Manipulation × percent), at least the floor.
; Values: base, slope, percent
