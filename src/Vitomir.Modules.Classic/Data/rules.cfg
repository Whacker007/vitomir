; What a revive sets frenzy to (health, blood and mana are the fractions its caller gives).
ReviveDefaults = 0

; A fallen member taken out of the party is revived at this share of health and of blood.
PartyLeaverReviveFraction = 0.1

; Whether a dead pedestrian revives where it was first placed.
PedestrianGoesHome = true

; Whether a vampire's death is announced as entering torpor (RPG_DIEDV); it is the same death either way.
TorporIsDeathForVampires = true

; The hit kind a drained human or a feed's kill dies of.
