; Vitomir's rules file: the game's rule numbers that 1.1 kept in its program rather than its data.
; This copy is the Classic game's own, with every key at its default (1.1's number unless a comment says it is ours).
; It is written from the game's code: change the numbers in a module of your own, not here.
;
; A player module changes a rule by carrying a rules.cfg at the top of its Data folder with only the keys it changes,
; under their [Section]. The layers are: the defaults in the code, this file, then each module's in load order, the
; later winning. Such a module is a rules module, and a game whose rules differ from 1.1's is modded.
; A list is one line, comma separated. ; and # start a comment, at the start of a line or after a value. A key the
; game does not know is warned of and passed over; a value that does not read keeps the layer below. A key marked
; fixed is listed but kept at its value.
; Where an enabled Fix meets a number here, the Fix works on top of the number this file gives.

[Stats]
; A character's stats before its template and sheet are read, and the limits every stat write is held to. A stat by
; number: 0 Strength, 1 Dexterity, 2 Stamina, 3 Perception, 4 Intelligence, 5 Wits, 6 Blood, 7 Humanity, 8 Frenzy, 9
; Generation, 10 Faith, 11 Charisma, 12 Manipulation, 13 Appearance, 14 Frenzy Rating, 15 Blood Rating, 16 Blood Pool,
; 17 Mana, 18 Mana Pool.

; The value every stat (base and current) holds before a template's tags are read. A stat the template does not name
; keeps it.
StatUnsetDefault = 20

; Health and maximum health before a template sets them.
; Values: health, maximum health
HealthDefault = 100, 100

; The actor type a template that names none gets (0 vampire, 1 ghoul, 2 human, 3 monster). 83 of the 696 actor templates
; rely on it.
ActorTypeDefault = 0

; The team a template that names none gets (8 is TEAM_NONE, nobody's side).
TeamDefault = 8

; The ceiling a stat with no authored maximum is held to, at every stat write.
StatCeiling = 10000

; The floor every stat write of a character that is not a player's is held to.
StatFloor = 0

; An authored stat limit of this value means no limit.
; fixed: a marker of the sheets' and clans' files, not a rule
StatNoLimitMarker = -1

; Every stat's maximum when a player's sheet is reset before it is read, and the two pools' (blood pool and mana pool).
; Values: every stat, the two pools
SheetResetMax = 100, 1000

; The values a sheet's reset writes before the sheet's own, by stat number. They are written in 1.1's order, the pools
; before what they hold.
SheetResetValues = 20, 20, 20, 20, 20, 20, 100, 20, 20, 13, 20, 20, 20, 20, 20, 1, 100, 100, 100

; The stats the character sheet offers a raise button for, by stat number: the six physical and mental, the three
; social.
RaisableStats = 0, 1, 2, 3, 4, 5, 11, 12, 13

; The stats only a human's sheet may raise, by stat number: Faith (10).
RaisableStatsHuman = 10

; The clamp on both spendable and lifetime experience.
ExperienceCap = 100000000

[Ranks]
; The rank ladder: the lifetime experience each rank needs, and what reaching it gives. Per rank and actor type, not per
; generation.

; Lifetime experience needed for ranks 0 to 4. Rank is reckoned from lifetime experience, so spending never demotes.
RankThresholds = 0, 5000, 10000, 50000, 200000

; How many ranks there are (ACTOR_MAXRANKS).
; fixed: the rank titles' keys and the tables are made for five
RankCount = 5

; A vampire's rank bonus to the blood pool on reaching ranks 1 to 4; the pool then refills.
; Values: rank 1, rank 2, rank 3, rank 4
RankBonusVampirePool = 20, 20, 30, 40

; A vampire's rank bonus to maximum health on reaching ranks 1 to 4; the character is healed by as much.
; Values: rank 1, rank 2, rank 3, rank 4
RankBonusVampireHealth = 20, 30, 50, 100

; A ghoul's rank bonus to the blood pool on reaching ranks 1 to 4; the pool then refills.
; Values: rank 1, rank 2, rank 3, rank 4
RankBonusGhoulPool = 10, 10, 15, 20

; A ghoul's rank bonus to maximum health on reaching ranks 1 to 4; the character is healed by as much.
; Values: rank 1, rank 2, rank 3, rank 4
RankBonusGhoulHealth = 25, 40, 75, 150

; A human's rank bonus to the mana pool on reaching ranks 1 to 4; the pool then refills.
; Values: rank 1, rank 2, rank 3, rank 4
RankBonusHumanPool = 20, 40, 60, 80

; A human's rank bonus to maximum health on reaching ranks 1 to 4; the character is healed by as much.
; Values: rank 1, rank 2, rank 3, rank 4
RankBonusHumanHealth = 20, 40, 60, 80

; A monster's rank bonus to the blood pool on reaching ranks 1 to 4 (nothing in 1.1); the pool then refills.
; Values: rank 1, rank 2, rank 3, rank 4
RankBonusMonsterPool = 0, 0, 0, 0

; A monster's rank bonus to maximum health on reaching ranks 1 to 4 (nothing in 1.1); the character is healed by as
; much.
; Values: rank 1, rank 2, rank 3, rank 4
RankBonusMonsterHealth = 0, 0, 0, 0

; Whether crossing two ranks in one award pays only the last rank's bonus (1.1's quirk). false pays each rank crossed,
; in turn.
MultiRankAwardsOnlyLast = true

; Maximum health gained when a human is made a vampire (the scripts' SetActorType). 0: nothing, as Vitomir has played
; it.
; ours: not 1.1's number.
; unsure: 1.1 was measured giving +20 at the Embrace; where it comes from is not found in the scripts, the born effects
; or the type's setter, so the default is 0 until it is
EmbraceMaxHealthGain = 0

[Healing]
; Healing and what the engine itself drains. Most regeneration is data (the born effects' rates are misc/effects.ned's).

; The effects a vampire is born with.
BornEffectsVampire = ef_decreasefrenzy

; The effects a ghoul is given when revived (a ghoul is born with none).
BornEffectsGhoul = ef_decreasefrenzy

; The effects a human is born with.
BornEffectsHuman = ef_increasemanaot, ef_increasebloodot

; Frenzy a heal takes off a vampire or a ghoul for each point of health asked (not the points that fitted).
HealCalmsFrenzy = 1

; Nobody under this much health is healed.
HealFloor = 1

; Whether a human (not NOBLEED) whose blood reaches exactly 0 dies on the spot.
HumanBleedsOutAtZeroBlood = true

[Advancement]
; What experience buys: an attribute point, a discipline level, and the network game's party award.

; The base-value bands of an attribute's cost rate: under the first, the first rate; under the second, the second; and
; so on; at or over the last, the last rate.
StatRaiseCostBands = 50, 60, 70, 80, 90

; The rate of each band: an attribute point costs (whole) base value times the rate. Christof's Strength 30 costs 120.
StatRaiseCostRates = 4, 5, 6, 8, 10, 15

; What one purchase adds, what a Storyteller's lowering takes, and the floor a lowering stops at.
StatRaiseStep = 1

; The multiplier on a discipline's experience column: learning it, then levels 0 to 1, 1 to 2, 2 to 3 and 3 to 4. Worked
; in single precision, as 1.1 does: 500 × 1.4 is 700.
DisciplineLevelMultipliers = 1, 1.4, 2, 4, 8

; The cost multiplier outside the clan's three groups, and for everything for a Caitiff or a character with no clan (in
; clan: 1).
DisciplineOutOfClanMultiplier = 1.25

; Whether learning a group's first discipline also pays the group's own price (game.ndg's).
DisciplineGroupFirstPrice = true

; A discipline's levels.
; fixed: the shape of the discipline file (game.ndd)
DisciplineMaxLevel = 5

; Whether, in a network game, a party award is divided evenly among the players present (a zero share gives nothing).
; false gives each the whole award, as a single-player party award does.
PartyAwardSplitNetwork = true

[Combat]
; The melee blow: whether it lands, how hard, the critical, and how much the target soaks.

; A blow lands when the to-hit margin (offence less defence, truncated toward zero) is greater than this.
HitMargin = 0

; Over this margin a blow is a critical: doubled, and it may stake. Shots and the stake read it too.
CriticalMargin = 60

; What a doubling (silver, a critical) adds to the blow's reported multiplier: the hit reaction and the messages read
; it. The damage itself is doubled; this number does not scale it.
CriticalMultiplierStep = 2

; Whether a silver weapon against a HURTBYSILVER target doubles the damage (before the critical).
SilverDoubles = true

; Defence lost by a target that is restrained or feeding.
HelplessDefencePenalty = 30

; Defence a target loses from behind: the facing dot times this (a player's attack only).
BackstabScale = 20

; How much the two must face the same way (the dot of their facings) for the backstab.
BackstabMinDot = 0.2

; Whether the backstab is a player's attack's only.
BackstabPlayersOnly = true

; Each damage die is the floor plus a roll times this span: 9 makes a d10 of 1 to 10.
DamageDieSpan = 9

; The floor of each damage die.
DamageDieFloor = 1

; The damage pool's points per die, and the dice per point (its inverse, which 1.1 multiplies by); the remainder is
; scaled by one roll.
; Values: points per die, dice per point
DamagePointsPerDie = 10, 0.1

; Whether the damage pool adds the attacker's Strength (an attack flagged 0x10000 never does).
DamageIncludesStrength = true

; NORMAL (bashing) soak: the target's soak plus its Stamina times the first share; Fortitude times the second.
; Values: Stamina share, Fortitude share
SoakNormal = 1, 1

; LETHAL soak: the soak plus Stamina times the first share (a human's times the second); Fortitude times the third.
; Values: Stamina share, a human's Stamina share, Fortitude share
SoakLethal = 1, 0, 1

; AGGRAVATED soak: the soak plus Stamina times the first share; Fortitude times the second.
; Values: Stamina share, Fortitude share
SoakAggravated = 0, 1

; Electric, Fire, Sun, Faith and Cold are soaked at this share of the soak, and of Fortitude.
ElementalSoakShare = 0.5

; Whether Poison and Disease are soaked by the soak alone, Fortitude not counting.
PoisonDiseaseIgnoreFortitude = true

; Health a character must keep to stay up; under it, damage is refused as past caring.
DeathThreshold = 1

; The actor types (0 vampire, 1 ghoul, 2 human, 3 monster) that take no SUN or FAITH damage. The ghoul's immunity is
; 1.1's.
SunAndFaithImmuneTypes = 2, 3, 1

; The share of a shot a party member takes from an attacker outside the party.
PartyShotShare = 0.75

; What a Cappadocian's FAITH damage is multiplied by.
CappadocianFaithMultiplier = 1.5

; What a melee blow on a container adds to the damage (it has no to-hit roll).
ContainerMeleeBonus = 1

; The chance a strike comes with its vox_attack bark (a draw on the random stream).
VoxAttackChance = 0.5

[Ranged]
; Shots: the scatter that makes a miss, the accuracy roll, the dice and the bullet.

; The scatter: spread = scale − (roll × scale + accuracy + Dexterity), times the percent; the aim turns by (roll × span
; − half) × spread degrees.
; Values: scale, percent, span, half
ScatterFormula = 100, 0.01, 30, 15

; The accuracy roll: a roll times Dexterity times these shares, plus the effects, for the firer and the target; it
; decides only the critical and a bullet's type.
; Values: firer's Dexterity share, target's Dexterity share
ProjectileAccuracyRoll = 1, 1

; What either side of the accuracy roll that is not a character rolls: a roll times this (traps, props).
ProjectileUnownedRoll = 50

; A shot's dice: its damage times the dice per point gives the count of dice, each the floor plus a roll times the span,
; the remainder over the points per die scaled by one roll.
; Values: dice per point, points per die, die span, die floor
ProjectileDice = 0.1, 10, 9, 1

; Against a vampire or a ghoul a bullet is NORMAL under this accuracy margin, LETHAL at or above it.
BulletLethalMargin = 20

; Whether a party member's shot cannot hit another party member.
PartyFriendlyFireOff = true

; How many of a thrown weapon's ITEM_AMOUNT a throw spends.
ThrownSpendsOne = 1

[Wounds]
; The flinch, the wound ladder and its penalties, the limp and the block.

; A blow must be more than this to make hurt noises or a flinch.
FlinchMinDamage = 1

; The flinch chance in percent: damage times this, less Stamina.
FlinchChancePerPoint = 8

; The flinch chance's floor and ceiling, and the scale of its roll.
; Values: floor, ceiling, roll's scale
FlinchChanceClamp = 5, 95, 100

; After a flinch, no hurt noise or flinch roll for this long (the stagger lock).
FlinchQuietMs = 3500

; The wound ladder: health over maximum above each value is rungs 0 to 4, else rung 5. The fourth is 1.1's 0.9, plainly
; meant for 0.09, so rung 3 is never reached; 0.09 would be a fix, not 1.1's.
WoundLadderThresholds = 0.69, 0.39, 0.19, 0.9, 0

; The penalties each rung (1 to 4) lays, by effect: ef_dmg_dexterity's level (-1 none).
WoundDexterityLevels = 1, 2, 3, 3

; ef_dmg_strength's level by rung 1 to 4 (-1 none).
WoundStrengthLevels = -1, 2, 3, 3

; ef_dmg_movespeed's level by rung 1 to 4 (-1 none): the limp.
WoundMoveSpeedLevels = -1, 2, 3, 4

; How long ef_dmg_movespeed lasts by rung 1 to 4, in milliseconds.
WoundMoveSpeedMs = 0, 8000, 20000, 50000

; MOVESPEED at or under this sets LIMPING.
LimpBelowMoveSpeed = 0.8

; Whether a melee blow soaked away entirely, with something in the off hand, plays the block.
ShieldBlockOnFullSoak = true

[Stake]
; The stake, the beheading, the special throw, the gibs and the gore.

; A critical with a staking attack on a vampire rolls (whole) a roll times this against STAKEPROTECTION; above it
; stakes, with no damage.
StakeRoll = 100

; A stake comes out by itself after this long, in milliseconds.
StakeDurationMs = 20000

; How close an unstaker closes (less its radius), and how far in front it stands.
UnstakeReach = 60

; The unstake approach asks again this often, in milliseconds.
UnstakeRetryMs = 250

; On a surviving melee blow with CANBEHEAD: behead when a roll times the scale is under Strength times the share plus
; the damage.
; Values: scale, Strength share
BeheadChance = 100, 0.1

; How long ef_beheaded runs, in milliseconds.
BeheadEffectMs = 100000

; A beheading's even chance: a roll at or over this is the instant death, under it the bleed-out.
BeheadBleedChoice = 0.5

; The bleed per tick as a share of maximum health: the instant death's, the bleed-out's (five ticks).
; Values: instant, bleed-out
BeheadBleedValues = 10, 0.2

; The damage handed to the death effects when a thrower died mid-throw (under the quick death's, so the slow death).
SpecialThrowDeadThrowerDamage = 10

; A CANGIBKILL character comes apart on a killing blow over this (no corpse, nothing to raise).
GibKillDamage = 80

; How many sub-pieces a gib asks for (twice each).
GibPieces = 8

; The damage over which a hit throws one loose chunk, and two (a chunk is a projectile).
; Values: one chunk, two
GibSprayThresholds = 5, 19

; The speed a severed head or a chunk is launched at.
GoreLaunchSpeed = 20

; How long a wound's blood or sparks show per damage point (ms), the bone chance, the death's bone chance, the blood's
; own time (ms) and the death's (ms). The look only, but its rolls are on the random stream.
; Values: ms per point, bone chance, death's bone chance, blood ms, death ms
WoundShowMsPerPoint = 80, 0.25, 0.33, 300, 8000

[Casting]
; What the engine adds to a discipline's cast. Costs, ranges, recasts and effects are game.ndd's and misc/effects.ned's;
; each discipline's behaviour is its script.

; The blood (a human's mana) a cast costs is paid whether it succeeds, fizzles or is resisted.
; fixed: the engine pays before the discipline's script decides a fizzle or a resist; it cannot know
CastCostPaidAlways = true

; Whether a cast's cost is multiplied by the caster's BLOODCOST effect.
CastCostScale = true

; A cast out of range walks up and asks again this often, in milliseconds.
CastApproachRetryMs = 250

; How far a Terrifying cast's event carries to minds.
TerrifyEventRange = 1000

; The cast count a scroll's temporary discipline is made with.
; unsure: what the count changes in play is not clear
ScrollCastCount = 100

; Quick slots for disciplines and items.
; fixed: the interface's layouts have six
QuickSlotCount = 6

[Feeding]
; The bite: the approach, the resist, the drain and its clock, the wrist, and the release.

; Close enough to bite, body to body.
FeedReach = 60

; The approach looks again this often, in milliseconds.
FeedApproachRetryMs = 250

; Within this the feeder walks to its victim; beyond it, runs.
FeedWalkWithin = 300

; The chance of vox_feedchase on a run (a draw on the random stream).
FeedChaseBarkChance = 0.2

; Where the victim is put in front of the feeder: for the neck, for the wrist.
; Values: neck, wrist
FeedVictimGap = 60, 75

; The feeder's chance against a resisting victim: Feed level times this, plus the feeder's Wits, less the victim's Wits
; and FEEDPROTECTION (only an armed, hostile, non-pedestrian, unmesmerised victim resists).
FeedResistPerLevel = 20

; The floor and cap of that chance.
; Values: floor, cap
FeedResistClamp = 5, 95

; The team that never resists (TEAM_PEDESTRIANS).
; fixed: a team's identity, not a number
FeedPedestrianTeam = 10

; Blood the victim loses each drain.
FeedDrainPerTick = 3

; Blood the feeder gains each drain: its BloodRating times this (paid before the empty check, so the killing drain still
; pays).
FeedGainPerBloodRating = 3

; The time between drains, in milliseconds: a feeder's, a FASTDRINKER's.
; Values: feeder, fast drinker
FeedTickMs = 1000, 500

; The first drain comes this long after the bite, in milliseconds; and the bite keeps the feeder busy as long.
; Values: first drain, the bite's busy time
FeedFirstDrainMs = 1000, 1000

; An AI feeder does not think for its feedDuration (a roll times the .nai's) plus this, in milliseconds: anybody's, a
; party member's.
; Values: anybody, a party member
FeedAiThinkPad = 4000, 9000

; A victim held by its feeder looks again this often, in milliseconds.
FeedVictimCheckMs = 500

; A wrist donor at or under this blood gives nothing; a wrist feed stops before it.
FeedDonorFloor = 10

; Letting go at the neck early kills when the victim's blood is under this over the Feed level (this at levels 0 and 1),
; and under a roll of it.
FeedReleaseKillBase = 25

; The chance of the suck noise and of the bloodpointdrain noise each drain (draws on the random stream).
; Values: suck, bloodpointdrain
FeedSuckNoiseChance = 0.1, 0.1

; A network character's base BloodRating by clan as 1.1 makes one: the Ventrue's (their weakness), the Giovanni's.
; Values: Ventrue, Giovanni
NetClanBloodRating = 0.6, 0.75

; Whether a new Giovanni network character is a FASTDRINKER (the drain twice as often): the clan's deadlier feed.
GiovanniFastDrinker = true

[Frenzy]
; Frenzy and Humanity: when a vampire frenzies and calms, what a blow stirs, and what a kill costs.

; At or above this frenzy a vampire or a ghoul frenzies.
FrenzyThreshold = 100

; At or below this a frenzy ends.
FrenzyCalm = 25

; Crossing this upward says vox_nearfrenzy.
FrenzyNearBark = 80

; The effects a frenzy lays beside ef_frenzy (level 0), and takes off at its end.
FrenzyEffects = ef_frz_strength, ef_frz_dexterity

; The chance a frenzy costs a clan with the frenzy-appearance weakness (the Gangrel) a point of base Appearance.
GangrelFrenzyAppearanceChance = 0.1

; Frenzy a blow adds = damage × (Blood × scale × blood term + empty term) × (FrenzyRating × scale × rating term + zero
; term) × (fire term for FIRE) × (Wits × scale × Wits term + 1 when Wits is over the last value).
; Values: scale, blood term, empty term, rating term, zero term, fire term, Wits term, Wits over
FrenzyFromDamage = 0.01, -1.5, 2, 1.5, 0.5, 1.25, -0.8, 20

; What the scripts' ActorFrenzy and ActorUnfrenzy apply to frenzy.
; Values: provoke, soothe
ProvokeFrenzyValue = 100, -99

; Humanity a HUMANITYTRACK vampire loses (base) for each HUMANITYLOSS kill. In a network game only with Track Humanity.
HumanityPerKill = 5

; The actor types (0 vampire, 1 ghoul, 2 human, 3 monster) a kill's Humanity is taken from.
HumanityLossActorTypes = 0

; At or above this Humanity a loss says vox_lostHumanity; under it, vox_lowHumanity.
LowHumanityBark = 20

; A revive raises Humanity to this when it is below it.
HumanityFloorOnRevive = 20

; Whether a HUMANITYTRACK character at Humanity 0 ends the game (in a network game it is a permanent frenzy instead).
